[package]
name = "rusty_messenger"
description = "A simple messenger on the rust"
version = "0.1.0"
edition = "2024"
rust-version = "1.97.0"

[dependencies]
axum = "0.8.9"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["full"] }

