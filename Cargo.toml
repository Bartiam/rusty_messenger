[package]
name = "rusty_messenger"
description = "A simple messenger on the rust"
version = "0.1.0"
edition = "2024"
rust-version = "1.97.0"

[dependencies]
axum = { version = "0.8.9", features = ["ws"] }
serde = "1.0.229"
tokio = { version = "1.53.1", features = ["full"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
